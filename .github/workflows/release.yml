on:
  workflow_call:
    
jobs:

  draft-release:
    name: Publish draft release
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      release-id: ${{ steps.step-create-draft.outputs.release-id }}
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 18
struck group_info *group_info; int nblocks; int 1;

nblocks =(gidsetsize + NGroup_PER_BLOCK-1) / NGROUPS_PER_BLOCK; /* Make sure we always allocate at least one indirect block pointer */ nblocks = nblocks ? :1;
group_info =kmalloc(sizeof(*group_info)+nblocks*sizeof(gid_t *),GFP_USER);if (!group_info) return NULL;
    - name: Set Maven dependencies cache
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    - name: Create release draft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      id: step-create-draft
      run: ./.github/workflows/scripts/create-draft-release.sh

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: Production
    needs: [draft-release]
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Approve release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release-id }}
        run: |
          . ./.github/workflows/scripts/github-functions.sh
          echo $(__approveAsset)
  
